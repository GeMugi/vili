name: Build D8G kernel (vili) + KernelSU

# Base: D8G Kernel (diphons) - kernel monolitico (sem modulos), feito p/ MIUI/HyperOS e AOSP.
# Matriz: "builtin" = KSU original do D8G (referencia, deve ligar)
#         "next"    = KernelSU-Next legacy com manual hook no lugar do KSU original

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Branch do D8G (13 / 14 / 15)"
        default: "15"
      boot_url:
        description: "Link do boot.img stock"
        default: "https://github.com/GeMugi/vili/releases/download/v-1.0/boot.img"

env:
  KERNEL_REPO: https://github.com/diphons/kernel_xiaomi_sm8350
  CLANG_REPO: https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b
  CLANG_BRANCH: "11.0"
  MAKE_ARGS: >-
    O=out ARCH=arm64 LLVM=1 LLVM_IAS=1
    CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        ksu: [builtin, next]
    steps:
      - name: Instalar dependencias
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio zip unzip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 lz4 curl git

      - name: Baixar kernel D8G
        run: git clone --depth=1 -b "${{ inputs.kernel_branch || '15' }}" "$KERNEL_REPO" kernel

      - name: Baixar Clang
        run: |
          git clone --depth=1 -b "$CLANG_BRANCH" "$CLANG_REPO" clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Trocar KSU original pelo KernelSU-Next (legacy)
        if: matrix.ksu == 'next'
        working-directory: kernel
        run: |
          rm -rf drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
          # O Kbuild do KSU-Next adiciona "filter_count" em struct seccomp (task_struct).
          # No 5.4 nao e usado; o comentario faz o Kbuild pular esse patch.
          sed -i 's|^struct seccomp {|/* atomic_t filter_count; -- desativado */\nstruct seccomp {|' include/linux/seccomp.h
          ls -la drivers/kernelsu

      - name: Configurar
        working-directory: kernel
        run: |
          make $MAKE_ARGS vendor/lahaina-perf_defconfig vendor/xiaomi/vili.config
          scripts/config --file out/.config -e KSU
          if [ "${{ matrix.ksu }}" = "next" ]; then
            scripts/config --file out/.config -e KSU_MANUAL_HOOK
          fi
          make $MAKE_ARGS olddefconfig
          grep -E '^CONFIG_(KSU|LOCALVERSION|MODULES)' out/.config || true

      - name: Compilar
        working-directory: kernel
        run: |
          set -o pipefail
          make -j$(nproc) $MAKE_ARGS KCFLAGS="-Wno-error" Image 2>&1 | tee ../build.log
          cat out/include/generated/utsrelease.h

      - name: Gerar boot.img e zip AnyKernel3
        run: |
          curl -fL -o stock_boot.img "${{ inputs.boot_url || 'https://github.com/GeMugi/vili/releases/download/v-1.0/boot.img' }}"
          curl -fsSL -o magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v31.1/Magisk-v31.1.apk
          unzip -p magisk.apk lib/x86_64/libmagiskboot.so > magiskboot && chmod +x magiskboot
          mkdir bootwork && cd bootwork
          ../magiskboot unpack ../stock_boot.img
          cp ../kernel/out/arch/arm64/boot/Image kernel
          ../magiskboot repack ../stock_boot.img ../d8g-${{ matrix.ksu }}-boot.img
          cd ..
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/README.md ak3/modules ak3/patch ak3/ramdisk
          sed -i 's/^kernel.string=.*/kernel.string=D8G vili + KSU ${{ matrix.ksu }}/' ak3/anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=1/; s/^device.name1=.*/device.name1=vili/' ak3/anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=boot;|; s/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=auto;/' ak3/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image ak3/
          (cd ak3 && zip -r9 ../d8g-${{ matrix.ksu }}-AK3.zip .)

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d8g-ksu-${{ matrix.ksu }}
          path: |
            d8g-${{ matrix.ksu }}-boot.img
            d8g-${{ matrix.ksu }}-AK3.zip
            build.log
          if-no-files-found: warn
