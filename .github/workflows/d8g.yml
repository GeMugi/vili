name: Build D8G kernel (vili) + KernelSU

# Base: D8G Kernel (diphons) - kernel monolitico (sem modulos), feito p/ MIUI/HyperOS e AOSP.
# Matriz: "builtin" = KSU original do D8G (referencia, deve ligar)
#         "next"    = KernelSU-Next legacy (syscall table hook) no lugar do KSU original

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Branch do D8G (13 / 14 / 15)"
        default: "15"
      boot_url:
        description: "Link do boot.img stock"
        default: "https://github.com/GeMugi/vili/releases/download/v-1.0/boot.img"

env:
  KERNEL_REPO: https://github.com/diphons/kernel_xiaomi_sm8350
  CLANG_REPO: https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b
  CLANG_BRANCH: "11.0"
  MAKE_ARGS: >-
    O=out ARCH=arm64 LLVM=1 LLVM_IAS=1
    CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ksu: [builtin, next]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          for i in 1 2 3 4 5; do
            sudo apt-get update && sudo apt-get install -y --fix-missing bc bison flex libssl-dev libelf-dev cpio zip unzip \
              gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 lz4 curl git && break
            echo "apt falhou (tentativa $i), aguardando..."; sleep 30
          done

      - name: Baixar kernel D8G
        run: git clone --depth=1 -b "${{ inputs.kernel_branch || '15' }}" "$KERNEL_REPO" kernel

      - name: Baixar Clang
        run: |
          git clone --depth=1 -b "$CLANG_BRANCH" "$CLANG_REPO" clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Trocar KSU original pelo KernelSU-Next (legacy)
        if: matrix.ksu == 'next'
        working-directory: kernel
        run: |
          rm -rf drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
          # O Kbuild do KSU-Next adiciona "filter_count" em struct seccomp (task_struct).
          # No 5.4 nao e usado; o comentario faz o Kbuild pular esse patch.
          sed -i 's|^struct seccomp {|/* atomic_t filter_count; -- desativado */\nstruct seccomp {|' include/linux/seccomp.h
          # Desliga os hooks manuais do KSU antigo do D8G (assinaturas incompativeis);
          # o KSU-Next vai usar o modo "syscall table hook", que nao precisa deles.
          for f in fs/devpts/inode.c fs/exec.c fs/stat.c fs/read_write.c fs/open.c drivers/input/input.c; do
            sed -i 's/IS_ENABLED(CONFIG_KSU)/0 \/* D8G old KSU hook *\//; s/^#ifdef CONFIG_KSU$/#if 0 \/* D8G old KSU hook *\//' "$f"
          done
          grep -c "D8G old KSU hook" fs/exec.c fs/devpts/inode.c
          # path_umount ja existe no D8G; exporta para o LTO nao descartar
          python3 - <<'PY2'
          import re
          p = "fs/namespace.c"
          s = open(p).read()
          if "EXPORT_SYMBOL(path_umount)" not in s:
              i = s.index("\nint path_umount(struct path *path, int flags)")
              j = s.index("\n}\n", i) + 3
              s = s[:j] + "EXPORT_SYMBOL(path_umount);\n" + s[j:]
              open(p, "w").write(s)
          print("path_umount exportado")
          PY2
          ls -la drivers/kernelsu

      - name: Configurar
        working-directory: kernel
        run: |
          make $MAKE_ARGS vendor/lahaina-perf_defconfig vendor/xiaomi/vili.config
          scripts/config --file out/.config -e KSU
          if [ "${{ matrix.ksu }}" = "next" ]; then
            scripts/config --file out/.config -d KSU_MANUAL_HOOK -d KSU_KPROBES_HOOK -e KSU_SYSCALL_TABLE_HOOK
          fi
          make $MAKE_ARGS olddefconfig
          grep -E '^CONFIG_(KSU|LOCALVERSION|MODULES)' out/.config || true

      - name: Compilar
        working-directory: kernel
        run: |
          set -o pipefail
          make -j$(nproc) $MAKE_ARGS KCFLAGS="-Wno-error" Image.gz dtbs 2>&1 | tee ../build.log
          cat out/include/generated/utsrelease.h

      - name: Gerar dtb, dtbo.img e zip AnyKernel3
        run: |
          Q=kernel/out/arch/arm64/boot/dts/vendor/qcom
          cat $Q/lahaina.dtb $Q/lahaina-v2.dtb $Q/lahaina-v2.1.dtb > dtb
          python3 kernel/scripts/dtc/mkdtboimg.py create dtbo.img --page_size=4096 $Q/vili-sm8350-overlay.dtbo
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/README.md ak3/modules ak3/patch ak3/ramdisk/* ak3/anykernel.sh
          # Mesmo esquema do zip que funciona no vili: Image.gz no boot, dtb no vendor_boot, dtbo.img no dtbo
          cp patches/anykernel-vili.sh ak3/anykernel.sh
          sed -i "s/^kernel.string=.*/kernel.string=D8G vili + KSU ${{ matrix.ksu }}/" ak3/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image.gz dtb dtbo.img ak3/
          (cd ak3 && zip -r9 ../d8g-${{ matrix.ksu }}-AK3.zip .)
          ls -la dtb dtbo.img kernel/out/arch/arm64/boot/Image.gz

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d8g-ksu-${{ matrix.ksu }}
          path: |
            d8g-${{ matrix.ksu }}-AK3.zip
            build.log
          if-no-files-found: warn
