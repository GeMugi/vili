name: Build vili kernel (KernelSU-Next)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Repositorio do codigo do kernel"
        default: "https://github.com/LineageOS/android_kernel_xiaomi_sm8350"
      kernel_branch:
        description: "Branch (lineage-22.2 = 5.4.289, mesma versao do stock)"
        default: "lineage-22.2"
      config_mode:
        description: "lineage = defconfig do LineageOS p/ vili | stock = config extraida do aparelho"
        type: choice
        options: [lineage, stock]
        default: lineage
      relax_modversions:
        description: "Aceitar modulos do vendor com CRC diferente (necessario p/ HyperOS)"
        type: boolean
        default: true
      boot_url:
        description: "Link do boot.img stock (para gerar o boot.img pronto)"
        default: "https://github.com/GeMugi/vili/releases/download/v-1.0/boot.img"

env:
  CLANG_REPO: https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b
  CLANG_BRANCH: "11.0"
  MAKE_ARGS: >-
    O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 TARGET_PRODUCT=vili
    CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Liberar espaco e instalar dependencias
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio zip unzip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 lz4 curl git

      - name: Baixar codigo do kernel
        run: git clone --depth=1 -b "${{ inputs.kernel_branch || 'lineage-22.2' }}" "${{ inputs.kernel_repo || 'https://github.com/LineageOS/android_kernel_xiaomi_sm8350' }}" kernel

      - name: Baixar Clang (AOSP r416183b)
        run: |
          git clone --depth=1 -b "$CLANG_BRANCH" "$CLANG_REPO" clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
          ./clang/bin/clang --version

      - name: Adicionar KernelSU-Next (branch legacy, p/ kernel 5.4)
        working-directory: kernel
        run: curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy

      - name: Backports p/ KSU sem alterar estruturas do kernel
        working-directory: kernel
        run: |
          # path_umount (+ export) aplicado antes; o Kbuild do KSU detecta e nao refaz
          git apply ../patches/ksu-5.4-path_umount.patch
          # O Kbuild do KSU adiciona "filter_count" em struct seccomp (dentro de task_struct).
          # No 5.4 esse campo nao e usado, e mudar task_struct quebra os modulos do vendor.
          # Um comentario com o texto faz o Kbuild pular esse patch.
          sed -i 's|^struct seccomp {|/* atomic_t filter_count; -- desativado: manter layout do stock */\nstruct seccomp {|' include/linux/seccomp.h
          grep -n "filter_count" include/linux/seccomp.h
          grep -n "EXPORT_SYMBOL(path_umount)" fs/namespace.c

      - name: Relaxar checagem de versao dos modulos
        if: ${{ inputs.relax_modversions != false }}
        working-directory: kernel
        run: |
          python3 - <<'PY'
          import re
          p = "kernel/module.c"
          s = open(p).read()
          new, n = re.subn(r'(disagrees about version of symbol %s\\n",\s*info->name,\s*symname\);\s*)return 0;',
                           r'\1return 1;', s, count=1)
          if n != 1:
              raise SystemExit("Padrao de check_version nao encontrado")
          open(p, "w").write(new)
          print("check_version relaxado")
          PY

      - name: Configurar
        working-directory: kernel
        run: |
          mkdir -p out
          if [ "${{ inputs.config_mode || 'lineage' }}" = "stock" ]; then
            cp ../configs/vili_stock.config out/.config
          else
            make $MAKE_ARGS vendor/lahaina-qgki_defconfig vendor/debugfs.config \
              vendor/xiaomi_QGKI.config vendor/vili_QGKI.config
          fi
          scripts/config --file out/.config -e KSU -e KPROBES -e EXT4_FS -d MODULE_SIG_FORCE
          make $MAKE_ARGS olddefconfig
          grep -E '^CONFIG_(KSU|LOCALVERSION|LTO_CLANG|CFI_CLANG|MODVERSIONS)' out/.config

      - name: Compilar
        working-directory: kernel
        run: |
          set -o pipefail
          make -j$(nproc) $MAKE_ARGS KCFLAGS="-Wno-error" Image 2>&1 | tee ../build.log
          cat out/include/generated/utsrelease.h

      - name: Gerar zip AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/README.md ak3/modules ak3/patch ak3/ramdisk
          sed -i 's/^kernel.string=.*/kernel.string=vili + KernelSU-Next/' ak3/anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=1/; s/^device.name1=.*/device.name1=vili/' ak3/anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=boot;|; s/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=auto;/' ak3/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image ak3/
          (cd ak3 && zip -r9 ../vili-ksunext-AK3.zip .)

      - name: Gerar boot.img pronto
        if: ${{ (inputs.boot_url || 'https://github.com/GeMugi/vili/releases/download/v-1.0/boot.img') != '' }}
        run: |
          curl -fL -o stock_boot.img "${{ inputs.boot_url || 'https://github.com/GeMugi/vili/releases/download/v-1.0/boot.img' }}"
          curl -fsSL -o magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v31.1/Magisk-v31.1.apk
          unzip -p magisk.apk lib/x86_64/libmagiskboot.so > magiskboot && chmod +x magiskboot
          mkdir bootwork && cd bootwork
          ../magiskboot unpack ../stock_boot.img
          cp ../kernel/out/arch/arm64/boot/Image kernel
          ../magiskboot repack ../stock_boot.img ../vili-ksunext-boot.img

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vili-ksunext-${{ inputs.config_mode || 'lineage' }}
          path: |
            vili-ksunext-AK3.zip
            vili-ksunext-boot.img
            build.log
          if-no-files-found: warn
